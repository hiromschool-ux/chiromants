<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Выбор хироманта</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
  :root{--bg:#0d0b12;--surface:#14111e;--border:#2e2840;--gold:#c9a84c;--gold2:#e8c97a;--text:#e8e0f0;--muted:#7a6f8e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Montserrat,sans-serif;font-weight:300;min-height:100vh;padding-bottom:40px}
  header{text-align:center;padding:32px 20px 20px}
  header h1{font-family:"Cormorant Garamond",serif;font-size:1.7rem;font-weight:300;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  header p{color:var(--muted);font-size:.72rem;text-transform:uppercase;margin-top:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer}
  .card img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--border);margin:0 auto 10px;display:block}
  .card .name{font-size:.82rem;font-weight:500;line-height:1.3}
  .skip{display:block;margin:8px 16px 0;padding:14px;background:transparent;border:1px solid var(--border);border-radius:12px;color:var(--muted);font-family:Montserrat,sans-serif;font-size:.78rem;text-transform:uppercase;cursor:pointer;width:calc(100% - 32px)}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:.85rem}
  .spinner{width:32px;height:32px;border:2px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .success{text-align:center;padding:60px 20px}
  .success h2{font-family:"Cormorant Garamond",serif;font-size:1.5rem;color:var(--gold2);margin-bottom:8px}
  .err{padding:20px;color:var(--muted);font-size:.78rem;line-height:1.8;word-break:break-all}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div>Загружаю список...</div></div>
<script>
var SHEET_ID = "1fvN690wAz5uj682mXA60Mor6raNGIztORd-l2BVflSM";
var SHEET_NAME = "Доны";
var donors = [];

function showErr(msg) {
  document.getElementById("app").innerHTML = "<div class='err'>" + msg + "</div>";
}

function choose(idx) {
  var d = donors[idx];
  document.getElementById("app").innerHTML = "<div class='success'><div style='font-size:48px;margin-bottom:16px'>&#10024;</div><h2>" + d.name + "</h2><p style='color:var(--muted);font-size:.82rem'>Спасибо за выбор!</p></div>";
  setTimeout(function() {
    try { vkBridge.send("VKWebAppClose", {status:"success", payload:{pobeditel: d.name}}); } catch(e) {}
  }, 1500);
}

function skip() {
  try { vkBridge.send("VKWebAppClose", {status:"success", payload:{pobeditel:"Не выбран"}}); } catch(e) {}
}

function renderDonors() {
  var html = "<header><div style='font-size:36px;margin-bottom:8px'>&#128302;</div><h1>Выберите хироманта</h1><p>Чей разбор понравился больше?</p></header><div class='grid'>";
  for (var i = 0; i < donors.length; i++) {
    html += "<div class='card' onclick='choose(" + i + ")'>";
    html += "<img src='" + donors[i].photo + "'>";
    html += "<div class='name'>" + donors[i].name + "</div></div>";
  }
  html += "</div><button class='skip' onclick='skip()'>Никто не понравился</button>";
  document.getElementById("app").innerHTML = html;
}

function loadDonors() {
  showErr("Загружаю данные...");
  var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&sheet=" + encodeURIComponent(SHEET_NAME);
  fetch(url)
    .then(function(resp) {
      showErr("Ответ: " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      showErr("Длина ответа: " + text.length);
      var start = text.indexOf("{");
      var end = text.lastIndexOf(")");
      if (start < 0) { showErr("Неверный формат ответа: " + text.substring(0, 200)); return; }
      var json = JSON.parse(text.substring(start, end));
      var rows = json.table.rows;
      showErr("Строк найдено: " + rows.length);
      donors = [];
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        if (!row.c || !row.c[0] || !row.c[0].v) continue;
        var id   = String(row.c[0].v);
        var name = row.c[1] && row.c[1].v ? String(row.c[1].v) : "";
        var sur  = row.c[2] && row.c[2].v ? String(row.c[2].v) : "";
        var stat = row.c[3] && row.c[3].v ? String(row.c[3].v).toLowerCase().trim() : "";
        if (id && name && stat.indexOf("акт") === 0) {
          donors.push({id: id, name: name + " " + sur, photo: "https://ui-avatars.com/api/?name=" + encodeURIComponent(name + " " + sur) + "&background=2e2840&color=c9a84c&size=100&bold=true"});
        }
      }
      if (donors.length === 0) { showErr("Активных донов не найдено"); return; }
      renderDonors();
    })
    .catch(function(e) {
      showErr("Ошибка: " + e.message);
    });
}

try { vkBridge.send("VKWebAppInit"); } catch(e) {}
loadDonors();
</script>
</body>
</html>
